name: 'Drift'
description: 'Documentation coverage and drift detection'
author: 'Ryan Waits'

branding:
  icon: 'file-text'
  color: 'green'

inputs:
  github-token:
    description: 'GitHub token for PR comments'
    required: false
    default: ${{ github.token }}
  working-directory:
    description: 'Working directory for the check'
    required: false
    default: '.'
  min-coverage:
    description: 'Minimum coverage percentage (0-100). Empty uses config.'
    required: false
    default: ''
  check-all:
    description: 'Check all workspace packages'
    required: false
    default: 'false'
  include-private:
    description: 'Include private packages'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2

    - name: Install Drift CLI
      shell: bash
      run: bun install -g @driftdev/cli

    - name: Run drift
      if: github.event.action != 'closed'
      id: drift
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        ARGS="--annotations --json"
        if [ -n "${{ inputs.min-coverage }}" ]; then
          ARGS="$ARGS --min ${{ inputs.min-coverage }}"
        fi
        if [ "${{ inputs.check-all }}" = "true" ]; then
          ARGS="$ARGS --all"
        fi
        if [ "${{ inputs.include-private }}" = "true" ]; then
          ARGS="$ARGS --private"
        fi
        set +e
        drift $ARGS > "${{ github.action_path }}/drift-out.txt"
        CODE=$?
        set -e
        bun run "${{ github.action_path }}/comment.ts" "${{ github.action_path }}/drift-out.txt" || true
        exit $CODE
